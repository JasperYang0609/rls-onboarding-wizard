name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/generate_package.py tests/test_generate_package.py
